name: macssential
options:
  bundleIdPrefix: com.macssential
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  macssential:
    type: application
    platform: macOS
    sources:
      - path: macssential
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macssential.macssential
        PRODUCT_NAME: macssential
        INFOPLIST_FILE: macssential/Info.plist
        CODE_SIGN_ENTITLEMENTS: macssential/macssential.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete

  macssentialTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macssentialTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macssential.macssentialTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/macssential.app/Contents/MacOS/macssential"
    dependencies:
      - target: macssential
