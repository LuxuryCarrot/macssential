name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches Info.plist version
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" macssential/macssential/Info.plist)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Info.plist version ($PLIST_VERSION)"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "DEVELOPER_ID_CERT_P12 not set -- skipping keychain import (unsigned release)"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build & Package DMG
        run: bash scripts/build-release.sh
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/macssential-*.dmg
          generate_release_notes: true
          name: "macssential v${{ steps.version.outputs.version }}"

      - name: Update appcast
        run: |
          if [ ! -f build/eddsa-signature.txt ]; then
            echo "No EdDSA signature -- skipping appcast update"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" macssential/macssential/Info.plist)
          SIG_LINE=$(tr -d '\n' < build/eddsa-signature.txt | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          PUB_DATE=$(LC_ALL=C date -u +"%a, %d %b %Y %H:%M:%S +0000")
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/macssential-${VERSION}.dmg"

          # The tag checkout is a detached HEAD; commit the appcast change on
          # top of the current main so the push cannot be rejected.
          git fetch origin main
          git checkout -B main origin/main

          ITEM="    <item>
                <title>Version ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_NUM}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure
                  url=\"${DMG_URL}\"
                  ${SIG_LINE}
                  type=\"application/octet-stream\" />
              </item>"

          python3 - "$ITEM" <<'PYEOF'
          import sys
          item = sys.argv[1]
          path = "docs/appcast.xml"
          content = open(path).read()
          marker = "<!-- Each <item> contains version info, download URL, and EdDSA signature -->"
          if marker not in content:
              sys.exit("appcast marker comment not found in docs/appcast.xml")
          content = content.replace(marker, marker + "\n" + item, 1)
          open(path, "w").write(content)
          print("Inserted appcast item")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "chore(release): update appcast for v${VERSION}"
          git push origin HEAD:main
